name: Build XA Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Prepare direct-download APK
        run: cp app/build/outputs/apk/debug/app-debug.apk XA-v1.0.0-debug.apk
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: XA-v1.0.0-debug
          path: XA-v1.0.0-debug.apk
          if-no-files-found: error
      - name: Publish direct APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "xa-build-${GITHUB_RUN_NUMBER}" XA-v1.0.0-debug.apk \
            --title "XA Installer - Build ${GITHUB_RUN_NUMBER}" \
            --notes "Experimental Android debug APK. Not yet device tested." \
            --target "${GITHUB_SHA}" \
            --latest
