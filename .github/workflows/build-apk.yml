name: Build XA Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle --no-daemon :app:assembleDebug
      - name: Prepare direct-download APK
        run: cp app/build/outputs/apk/debug/app-debug.apk XA-v1.0.0-debug.apk
      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "xa-latest" XA-v1.0.0-debug.apk \
            --title "XA Installer — Latest Test Build" \
            --notes "Experimental debug APK. Android 8+; device installation is not yet verified." \
            --prerelease --latest=false || \
          gh release upload "xa-latest" XA-v1.0.0-debug.apk --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: XA-v1.0.0-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Prepare directly downloadable APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/XA-v1.0.0-debug.apk
      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "xa-build-${GITHUB_RUN_NUMBER}" release/XA-v1.0.0-debug.apk \
            --title "XA Installer • Build ${GITHUB_RUN_NUMBER}" \
            --notes "Experimental debug APK built automatically from main. Android installation confirmation is required. Not a signed production release." \
            --target "${GITHUB_SHA}" \
            --latest
